server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理到后端（K8s/docker-compose 里后端 service 名统一为 agentflow）
    location /workflows { proxy_pass http://agentflow:8000; }
    location /run       { proxy_pass http://agentflow:8000; }
    location /runs      { proxy_pass http://agentflow:8000; }
    location /health    { proxy_pass http://agentflow:8000; }
}
