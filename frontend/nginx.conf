server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理到后端（docker-compose 里 backend 服务名）
    location /workflows { proxy_pass http://backend:8000; }
    location /run       { proxy_pass http://backend:8000; }
    location /runs      { proxy_pass http://backend:8000; }
    location /health    { proxy_pass http://backend:8000; }
}
