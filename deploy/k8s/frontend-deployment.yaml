apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentflow-frontend
  namespace: aiops
  labels:
    app: agentflow-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentflow-frontend
  template:
    metadata:
      labels:
        app: agentflow-frontend
    spec:
      containers:
      - name: frontend
        image: xqfgbc/aiops-agentflow-frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
